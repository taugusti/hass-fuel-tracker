<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Tracker</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#22201b; --muted:#6d685d; --line:#ddd6c7;
  --accent:#4b5d2a; --accent-ink:#fff; --accent-soft:#e3e8d4; --warn:#9a5b00; --warn-bg:#fbefd9;
  --bad:#a3302a; --c1:#4b5d2a; --c2:#b06a1f; --c3:#2f6f8f; --grid:#e9e3d6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171713; --card:#22221d; --ink:#ece8dd; --muted:#a29d90; --line:#3a3931;
  --accent:#9db866; --accent-ink:#141410; --accent-soft:#2e3524; --warn:#e7b25c; --warn-bg:#3a2f1c;
  --bad:#e07a72; --c1:#a7c26c; --c2:#e39a52; --c3:#6fb2d2; --grid:#2e2d27;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 90px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:20px;margin:0;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:13px}
.cars{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px 12px;font-size:13px;cursor:pointer}
nav.tabs button b{display:block;font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.shot{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:10px;text-align:center;min-height:150px;display:flex;flex-direction:column;gap:8px;justify-content:center;position:relative}
.shot.has{border-style:solid}
.shot .ttl{font-weight:600}
.shot img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.shot .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.shot .status{font-size:13px;color:var(--muted)}
.shot .status.err{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:15px;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f{margin-bottom:10px}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px;color:var(--ink)}
.check input{width:22px;height:22px;margin:0}
.check small{display:block;color:var(--muted);font-size:12px}
.ai{font-size:12px;color:var(--accent);margin-left:4px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.log .item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.log .item:last-child{border:0}
.log .thumbs{display:flex;gap:4px}
.log .thumbs img{width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer}
.log .main{flex:1;min-width:0}
.log .t{font-weight:600}
.log .d{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.tag.w{background:var(--warn-bg);color:var(--warn)}
svg text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:10}
.lb img{max-width:96vw;max-height:92vh}
.hide{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <header><div><h1>⛽ Fuel Tracker</h1><div class="sub" id="sub">Benzinlog for jeeperne</div></div></header>
  <div class="cars" id="cars"></div>

  <!-- TANK -->
  <section id="tab-tank">
    <div class="shots">
      <div class="shot" id="shot-pump">
        <div class="ttl">Pumpe-display</div>
        <img class="hide">
        <div class="status">Liter og pris</div>
        <div class="row">
          <button class="btn pri small" data-cap="pump">📷 Tag billede</button>
          <button class="btn small" data-pick="pump">Vælg</button>
        </div>
      </div>
      <div class="shot" id="shot-odo">
        <div class="ttl">Km-tæller</div>
        <img class="hide">
        <div class="status">Kilometerstand</div>
        <div class="row">
          <button class="btn pri small" data-cap="odo">📷 Tag billede</button>
          <button class="btn small" data-pick="odo">Vælg</button>
        </div>
      </div>
    </div>
    <input type="file" accept="image/*" capture="environment" id="file-cap" class="hide">
    <input type="file" accept="image/*" id="file-pick" class="hide">

    <div class="card">
      <h2 id="form-title">Ny tankning</h2>
      <div class="f"><label>Tidspunkt</label><input type="datetime-local" id="ts"></div>
      <div class="grid3">
        <div class="f"><label>Liter<span class="ai" id="ai-liters"></span></label><input type="number" inputmode="decimal" step="0.01" id="liters"></div>
        <div class="f"><label>Beløb kr<span class="ai" id="ai-total"></span></label><input type="number" inputmode="decimal" step="0.01" id="total"></div>
        <div class="f"><label>Kr/L<span class="ai" id="ai-ppl"></span></label><input type="number" inputmode="decimal" step="0.001" id="ppl"></div>
      </div>
      <div class="f"><label>Km-tæller (<span id="odo-unit">km</span>)<span class="ai" id="ai-odo"></span></label><input type="number" inputmode="decimal" step="0.1" id="odo"></div>
      <div id="warns"></div>
      <label class="check"><input type="checkbox" id="full" checked><span>Fyldt helt op<small>Forbrug beregnes fra fuld tank til fuld tank</small></span></label>
      <label class="check"><input type="checkbox" id="missed"><span>Der mangler en tankning siden sidst<small>Så bruges denne ikke til at beregne km/L for perioden</small></span></label>
      <div class="grid2">
        <div class="f"><label>Brændstof</label><input type="text" id="fuel" list="fuels"></div>
        <div class="f"><label>Station</label><input type="text" id="station" list="stations"></div>
      </div>
      <datalist id="fuels"><option>Blyfri 95 E10</option><option>Blyfri 95 E5</option><option>Blyfri 98</option><option>Diesel</option></datalist>
      <datalist id="stations"></datalist>
      <div class="f"><label>Note</label><input type="text" id="note"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn hide" id="cancel-edit">Annullér</button>
        <button class="btn pri" id="save">Gem tankning</button>
      </div>
    </div>
  </section>

  <!-- STATISTIK -->
  <section id="tab-stats" class="hide">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h2>Km/L pr. fuld tank</h2><div id="ch-kmpl"></div></div>
    <div class="card"><h2>Literpris</h2><div id="ch-price"></div></div>
    <div class="card"><h2>Udgift og kørsel pr. måned</h2><div id="ch-month"></div></div>
    <div class="card"><h2>Pr. år</h2><div id="tbl-year"></div></div>
    <div class="card"><h2>Mere</h2><div id="more"></div></div>
  </section>

  <!-- LOG -->
  <section id="tab-log" class="hide">
    <div class="card log"><h2>Tankninger</h2><div id="log"></div>
      <div style="margin-top:10px"><a class="btn small" id="csv" href="#">Hent CSV</a></div>
    </div>
  </section>

  <!-- BILER -->
  <section id="tab-cars" class="hide">
    <div id="car-forms"></div>
    <div class="card"><button class="btn" id="add-car">+ Tilføj køretøj</button></div>
    <div class="sub" id="ver" style="text-align:center"></div>
  </section>
</div>

<nav class="tabs">
  <button data-tab="tank" class="on"><b>⛽</b>Tank</button>
  <button data-tab="stats"><b>📈</b>Statistik</button>
  <button data-tab="log"><b>📋</b>Log</button>
  <button data-tab="cars"><b>🚙</b>Biler</button>
</nav>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const S = {vehicles:[], vid:null, tab:'tank', shots:{pump:null, odo:null}, ai:{pump:null, odo:null}, editId:null, fills:[], stats:null, busy:0};
const nf = (v, d=1) => v==null||isNaN(v) ? '–' : Number(v).toLocaleString('da-DK',{minimumFractionDigits:d, maximumFractionDigits:d});
const ni = v => v==null ? '–' : Math.round(v).toLocaleString('da-DK');
const fdate = ts => { if(!ts) return '–'; const d=new Date(ts); return d.toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'}); };
const veh = () => S.vehicles.find(v => v.id === S.vid);
const unitLabel = v => (v && v.odo_unit === 'mi') ? 'miles' : 'km';

async function api(path, opt={}) {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opt});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'), 2600); }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }

// ---------- køretøjer
async function loadVehicles(){
  S.vehicles = await api('api/vehicles');
  const act = S.vehicles.filter(v => v.active);
  let saved = null; try { saved = +localStorage.getItem('bs_vid'); } catch(e){}
  if (!S.vid) S.vid = (act.find(v => v.id === saved) || act[0] || {}).id;
  renderCars();
}
function renderCars(){
  $('#cars').innerHTML = S.vehicles.filter(v=>v.active).map(v =>
    `<button class="chip ${v.id===S.vid?'on':''}" data-v="${v.id}">${esc(v.name)}</button>`).join('');
  $$('#cars .chip').forEach(b => b.onclick = () => { S.vid = +b.dataset.v; try{localStorage.setItem('bs_vid', S.vid)}catch(e){}; renderCars(); refresh(); });
  $('#odo-unit').textContent = unitLabel(veh());
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- faner
$$('nav.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(t){
  S.tab = t;
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  ['tank','stats','log','cars'].forEach(x => $('#tab-'+x).classList.toggle('hide', x!==t));
  refresh();
}
async function refresh(){
  if (!S.vid) return;
  if (S.tab==='stats') renderStats(await api('api/stats?vehicle='+S.vid));
  if (S.tab==='log' || S.tab==='tank') { S.fills = await api('api/fills?vehicle='+S.vid); }
  if (S.tab==='log') renderLog();
  if (S.tab==='tank') { fillStationList(); checkWarnings(); }
  if (S.tab==='cars') renderCarForms();
}

// ---------- billeder
let pendingKind = null;
$$('[data-cap]').forEach(b => b.onclick = () => { pendingKind=b.dataset.cap; $('#file-cap').click(); });
$$('[data-pick]').forEach(b => b.onclick = () => { pendingKind=b.dataset.pick; $('#file-pick').click(); });
['#file-cap','#file-pick'].forEach(id => $(id).onchange = e => { const f=e.target.files[0]; e.target.value=''; if(f && pendingKind) handlePhoto(pendingKind, f); });

async function shrink(file, max=1600){
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ bmp = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, k = Math.min(1, max/Math.max(w,h));
  const c = document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}

async function handlePhoto(kind, file){
  const box = $('#shot-'+kind), img = box.querySelector('img'), st = box.querySelector('.status');
  box.classList.add('has'); st.classList.remove('err');
  st.innerHTML = '<span class="spin"></span> Claude aflæser…';
  S.busy++; updateSave();
  try {
    const dataUrl = await shrink(file);
    img.src = dataUrl; img.classList.remove('hide');
    const r = await api('api/extract', {method:'POST', body: JSON.stringify({kind, image:dataUrl, vehicle_id:S.vid})});
    S.shots[kind] = r.image; S.ai[kind] = r.data;
    if (r.error) { st.textContent = 'Kunne ikke aflæse: ' + r.error; st.classList.add('err'); }
    else applyAI(kind, r.data || {});
  } catch(e) { st.textContent = 'Fejl: ' + e.message; st.classList.add('err'); }
  S.busy--; updateSave(); checkWarnings();
}

function setAI(id, aiId, val, digits){
  if (val==null || val==='' || isNaN(+val)) return false;
  $(id).value = String(parseFloat((+val).toFixed(digits)));
  $(aiId).textContent = '✓ AI'; return true;
}
function applyAI(kind, d){
  const st = $('#shot-'+kind+' .status');
  if (kind==='pump'){
    const a = setAI('#liters','#ai-liters', d.liters, 2);
    const b = setAI('#total','#ai-total', d.total_price, 2);
    const c = setAI('#ppl','#ai-ppl', d.price_per_liter, 3);
    if (d.fuel_type && !$('#fuel').value) $('#fuel').value = d.fuel_type;
    autoCalc();
    st.textContent = (a||b||c) ? `${nf(d.liters,2)} L · ${nf(d.total_price,2)} kr` : 'Ingen tal fundet – tast selv';
  } else {
    const ok = setAI('#odo','#ai-odo', d.reading, 1);
    st.textContent = ok ? `${nf(d.reading, d.has_tenths?1:0)} ${d.unit && d.unit!=='ukendt' ? d.unit : ''}` : 'Kunne ikke læse tælleren – tast selv';
  }
  if (d.note) st.textContent += ' — ' + d.note;
}

// ---------- formular
['#liters','#total','#ppl'].forEach(id => $(id).addEventListener('input', e => { $(id.replace('#','#ai-')).textContent=''; autoCalc(e.target.id); checkWarnings(); }));
$('#odo').addEventListener('input', () => { $('#ai-odo').textContent=''; checkWarnings(); });
function autoCalc(changed){
  const L = parseFloat($('#liters').value), T = parseFloat($('#total').value), P = parseFloat($('#ppl').value);
  if (L>0 && T>0 && (!P || changed==='total' || changed==='liters') && changed!=='ppl') $('#ppl').value = (T/L).toFixed(2);
  else if (L>0 && P>0 && !T) $('#total').value = (L*P).toFixed(2);
}
function lastFillBefore(){
  const ts = $('#ts').value;
  return S.fills.filter(f => f.id !== S.editId && f.odometer!=null && (!ts || f.ts <= ts)).sort((a,b)=>a.ts<b.ts?1:-1)[0];
}
function checkWarnings(){
  const w = [];
  const L = parseFloat($('#liters').value), T = parseFloat($('#total').value), P = parseFloat($('#ppl').value), O = parseFloat($('#odo').value);
  if (L>0 && T>0 && P>0 && Math.abs(L*P - T) > Math.max(1, T*0.02)) w.push(`Tallene passer ikke sammen: ${nf(L,2)} L × ${nf(P,2)} kr = ${nf(L*P,2)} kr, men beløbet er ${nf(T,2)} kr.`);
  const v = veh(), last = lastFillBefore();
  if (last && O>0){
    const diff = O - last.odometer;
    if (diff < 0) w.push(`Km-tælleren (${nf(O,1)}) er lavere end sidst (${nf(last.odometer,1)}). ${v && v.odo_rollover ? `Gemmes som "tælleren er slået om" (${ni(v.odo_rollover)}).` : ''}`);
    else if (diff > 2000) w.push(`Det er ${ni(diff)} ${unitLabel(v)} siden sidste tankning – stemmer det?`);
  }
  const ai = S.ai.odo;
  if (ai && ai.unit && v && ((ai.unit==='miles' && v.odo_unit!=='mi') || (ai.unit==='km' && v.odo_unit==='mi')))
    w.push(`Claude mener tælleren viser ${ai.unit}, men bilen er sat op til ${unitLabel(v)}. Tjek under Biler.`);
  if (v && v.tank_l && L > v.tank_l * 1.05) w.push(`${nf(L,2)} L er mere end tanken (${nf(v.tank_l,0)} L).`);
  $('#warns').innerHTML = w.map(x => `<div class="warn">⚠️ ${esc(x)}</div>`).join('');
}
$('#ts').addEventListener('change', checkWarnings);
function updateSave(){ $('#save').disabled = S.busy>0; $('#save').textContent = S.busy>0 ? 'Venter på aflæsning…' : (S.editId?'Gem ændringer':'Gem tankning'); }
function fillStationList(){
  const st = [...new Set(S.fills.map(f=>f.station).filter(Boolean))];
  $('#stations').innerHTML = st.map(s=>`<option>${esc(s)}</option>`).join('');
}
function resetForm(){
  S.editId=null; S.shots={pump:null,odo:null}; S.ai={pump:null,odo:null};
  ['#liters','#total','#ppl','#odo','#station','#note','#fuel'].forEach(id=>$(id).value='');
  $$('.ai').forEach(e=>e.textContent='');
  $('#ts').value = nowLocal(); $('#full').checked = true; $('#missed').checked = false;
  ['pump','odo'].forEach(k=>{ const b=$('#shot-'+k); b.classList.remove('has'); b.querySelector('img').classList.add('hide'); b.querySelector('.status').textContent = k==='pump'?'Liter og pris':'Kilometerstand'; });
  $('#form-title').textContent='Ny tankning'; $('#cancel-edit').classList.add('hide'); $('#warns').innerHTML=''; updateSave();
  const lastFuel = S.fills.find(f=>f.fuel_type); if (lastFuel) $('#fuel').value = lastFuel.fuel_type;
}
$('#cancel-edit').onclick = resetForm;
$('#save').onclick = async () => {
  const body = {
    id: S.editId, vehicle_id: S.vid, ts: $('#ts').value,
    liters: $('#liters').value, price_total: $('#total').value, price_per_l: $('#ppl').value,
    odometer: $('#odo').value, full_tank: $('#full').checked, missed_previous: $('#missed').checked,
    fuel_type: $('#fuel').value.trim(), station: $('#station').value.trim(), note: $('#note').value.trim(),
    img_pump: S.shots.pump, img_odo: S.shots.odo, ai_pump: S.ai.pump, ai_odo: S.ai.odo,
  };
  try {
    await api('api/fills', {method:'POST', body: JSON.stringify(body)});
    toast(S.editId ? 'Ændringer gemt' : 'Tankning gemt');
    S.fills = await api('api/fills?vehicle='+S.vid);
    resetForm(); showTab('stats');
  } catch(e){ toast('Kunne ikke gemme: ' + e.message); }
};
function editFill(f){
  showTab('tank');
  S.editId = f.id; S.shots = {pump:f.img_pump, odo:f.img_odo};
  try { S.ai = {pump: f.ai_pump?JSON.parse(f.ai_pump):null, odo: f.ai_odo?JSON.parse(f.ai_odo):null}; } catch(e){ S.ai={pump:null,odo:null}; }
  $('#ts').value = f.ts; $('#liters').value = f.liters ?? ''; $('#total').value = f.price_total ?? ''; $('#ppl').value = f.price_per_l ?? '';
  $('#odo').value = f.odometer ?? ''; $('#full').checked = !!f.full_tank; $('#missed').checked = !!f.missed_previous;
  $('#fuel').value = f.fuel_type||''; $('#station').value = f.station||''; $('#note').value = f.note||'';
  ['pump','odo'].forEach(k => { const b=$('#shot-'+k), im=b.querySelector('img'), fn=k==='pump'?f.img_pump:f.img_odo;
    if (fn){ im.src='api/img/'+fn; im.classList.remove('hide'); b.classList.add('has'); b.querySelector('.status').textContent='Gemt billede'; } else { im.classList.add('hide'); b.classList.remove('has'); } });
  $('#form-title').textContent = 'Ret tankning'; $('#cancel-edit').classList.remove('hide'); updateSave();
  scrollTo(0,0);
}

// ---------- log
function renderLog(){
  const v = veh();
  $('#csv').href = 'api/export.csv?vehicle='+S.vid;
  if (!S.fills.length){ $('#log').innerHTML = '<div class="empty">Ingen tankninger endnu.</div>'; return; }
  $('#log').innerHTML = S.fills.map(f => `
    <div class="item">
      <div class="thumbs">${[f.img_pump,f.img_odo].filter(Boolean).map(i=>`<img src="api/img/${i}" data-full="api/img/${i}">`).join('')}</div>
      <div class="main">
        <div class="t">${nf(f.liters,2)} L · ${nf(f.price_total,2)} kr ${f.full_tank?'':'<span class="tag w">ikke fuld</span>'}${f.missed_previous?'<span class="tag w">hul før</span>':''}</div>
        <div class="d">${fdate(f.ts)} · ${f.odometer!=null?nf(f.odometer,1)+' '+unitLabel(v):'ingen km'}${f.station?' · '+esc(f.station):''}${f.price_per_l?' · '+nf(f.price_per_l,2)+' kr/L':''}</div>
        ${f.note?`<div class="d">${esc(f.note)}</div>`:''}
      </div>
      <button class="btn small" data-edit="${f.id}">Ret</button>
      <button class="btn small danger" data-del="${f.id}">✕</button>
    </div>`).join('');
  $$('[data-edit]').forEach(b => b.onclick = () => editFill(S.fills.find(f=>f.id===+b.dataset.edit)));
  $$('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Slet denne tankning?')) return; await api('api/fills/'+b.dataset.del, {method:'DELETE'}); toast('Slettet'); refresh(); });
  $$('.thumbs img').forEach(i => i.onclick = () => { $('#lb img').src=i.dataset.full; $('#lb').style.display='flex'; });
}
$('#lb').onclick = () => $('#lb').style.display='none';

// ---------- statistik
function renderStats(s){
  S.stats = s;
  const v = s.vehicle, mi = v.odo_unit==='mi';
  const k = (val, unit, label) => `<div class="kpi"><div class="v">${val}${unit?` <small>${unit}</small>`:''}</div><div class="l">${label}</div></div>`;
  const ls = s.last_segment;
  $('#kpis').innerHTML = [
    k(nf(s.avg_km_per_l,1), 'km/L', 'Gennemsnit'),
    k(ls?nf(ls.km_per_l,1):'–', 'km/L', 'Seneste fulde tank'),
    k(nf(s.avg_l_per_100km,1), 'L/100 km', 'Gennemsnit'),
    k(nf(s.avg_kr_per_km,2), 'kr/km', 'Brændstof pr. km'),
    k(ni(s.tracked_km), 'km', 'Kørt (registreret)'),
    k(ni(s.total_kr), 'kr', `Brugt i alt (${s.count} tankn.)`),
    k(ni(s.year_kr), 'kr', `Brugt i ${s.year}`),
    k(s.days_since_last==null?'–':Math.max(0,s.days_since_last), 'dage', 'Siden sidste tankning'),
  ].join('');

  // km/L
  const seg = s.segments;
  $('#ch-kmpl').innerHTML = seg.length < 1 ? '<div class="empty">Kræver mindst to fulde tankninger med km-tal.</div>'
    : lineChart(seg.map(x=>({x:x.ts, y:x.km_per_l, tip:`${fdate(x.ts)}: ${nf(x.km_per_l,1)} km/L (${ni(x.km)} km, ${nf(x.liters,1)} L)`})), {color:'var(--c1)', avg:s.avg_km_per_l, unit:'km/L'});
  $('#ch-price').innerHTML = s.prices.length < 1 ? '<div class="empty">Ingen literpriser endnu.</div>'
    : lineChart(s.prices.map(x=>({x:x.ts, y:x.kr_per_l, tip:`${fdate(x.ts)}: ${nf(x.kr_per_l,2)} kr/L`})), {color:'var(--c2)', avg:s.avg_kr_per_l, unit:'kr/L', digits:2});
  $('#ch-month').innerHTML = s.months.length < 1 ? '<div class="empty">Ingen data endnu.</div>' : barChart(s.months.slice(-12));

  $('#tbl-year').innerHTML = s.years.length ? `<table><tr><th>År</th><th>Km</th><th>Liter</th><th>Kr</th><th>km/L</th><th>Tankn.</th></tr>${
    s.years.map(y=>`<tr><td>${y.periode}</td><td>${ni(y.km)}</td><td>${nf(y.liters,1)}</td><td>${ni(y.kr)}</td><td>${nf(y.km_per_l,1)}</td><td>${y.fills}</td></tr>`).join('')}</table>` : '<div class="empty">Ingen data endnu.</div>';

  const rows = [
    ['Km-tæller ved seneste tankning', s.last_odometer!=null ? nf(s.last_odometer,1)+' '+unitLabel(v) : '–'],
    ['Bedste tank', s.best_segment ? `${nf(s.best_segment.km_per_l,1)} km/L (${fdate(s.best_segment.ts)})` : '–'],
    ['Dårligste tank', s.worst_segment ? `${nf(s.worst_segment.km_per_l,1)} km/L (${fdate(s.worst_segment.ts)})` : '–'],
    ['Gns. km mellem tankninger', s.avg_km_per_fill!=null ? ni(s.avg_km_per_fill)+' km' : '–'],
    ['Gns. kørsel pr. måned', s.km_per_month!=null ? ni(s.km_per_month)+' km' : '–'],
    ['Liter i alt', nf(s.total_liters,1)+' L'],
    ['Gns. literpris', s.avg_kr_per_l!=null ? nf(s.avg_kr_per_l,2)+' kr/L' : '–'],
    ['Seneste literpris', s.last_kr_per_l!=null ? nf(s.last_kr_per_l,2)+' kr/L' : '–'],
    ['Rækkevidde på fuld tank', s.range_km!=null ? `ca. ${ni(s.range_km)} km` : (v.tank_l ? '–' : 'Angiv tankstørrelse under Biler')],
    ['CO₂ fra brændstoffet', `ca. ${ni(s.co2_kg)} kg`],
  ];
  if (mi) rows.splice(1,0,['Gennemsnit i US mpg', nf(s.avg_us_mpg,1)]);
  $('#more').innerHTML = `<table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
}

function lineChart(pts, o){
  const W=400, H=210, L=38, R=10, T=10, B=24, digits=o.digits??1;
  const ys = pts.map(p=>p.y).concat(o.avg!=null?[o.avg]:[]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi-lo)*0.15 || hi*0.1 || 1; lo = Math.max(0, lo-pad); hi = hi+pad;
  const xs = pts.map(p => new Date(p.x).getTime()); let x0=Math.min(...xs), x1=Math.max(...xs); if (x0===x1){ x0-=864e5*15; x1+=864e5*15; }
  const X = t => L + (t-x0)/(x1-x0)*(W-L-R), Y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  const ticks = 4; let g='';
  for (let i=0;i<=ticks;i++){ const v = lo+(hi-lo)*i/ticks, y=Y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${nf(v,digits)}</text>`; }
  const span = (x1-x0)/864e5, fmt = span>400 ? {month:'short',year:'2-digit'} : {day:'numeric',month:'short'};
  for (let i=0;i<=3;i++){ const t=x0+(x1-x0)*i/3; g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${new Date(t).toLocaleDateString('da-DK',fmt)}</text>`; }
  if (o.avg!=null) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.avg)}" y2="${Y(o.avg)}" stroke="${o.color}" stroke-dasharray="4 4" opacity=".6"/>`;
  const d = pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  g += `<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="4" fill="${o.color}"><title>${esc(p.tip)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>` + (o.avg!=null?`<div class="legend">Stiplet linje = gennemsnit (${nf(o.avg,digits)} ${o.unit})</div>`:'');
}

function barChart(ms){
  const W=400, H=210, L=38, R=36, T=10, B=24;
  const maxKr = Math.max(...ms.map(m=>m.kr), 1), maxKm = Math.max(...ms.map(m=>m.km), 1);
  const bw = (W-L-R)/ms.length;
  let g='';
  for (let i=0;i<=4;i++){ const y=T+(H-T-B)*(1-i/4); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${ni(maxKr*i/4)}</text><text x="${W-R+6}" y="${y+4}">${ni(maxKm*i/4)}</text>`; }
  ms.forEach((m,i)=>{
    const x=L+i*bw, h=(H-T-B)*m.kr/maxKr;
    const lbl = new Date(m.periode+'-01').toLocaleDateString('da-DK',{month:'short'});
    g+=`<rect x="${x+bw*0.18}" y="${T+(H-T-B)-h}" width="${bw*0.64}" height="${h}" rx="3" fill="var(--c2)"><title>${lbl} ${m.periode.slice(0,4)}: ${ni(m.kr)} kr, ${ni(m.km)} km, ${nf(m.liters,1)} L</title></rect>`;
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${lbl}</text>`;
  });
  const d = ms.map((m,i)=>`${i?'L':'M'}${(L+i*bw+bw/2).toFixed(1)},${(T+(H-T-B)*(1-m.km/maxKm)).toFixed(1)}`).join(' ');
  if (ms.length>1) g+=`<path d="${d}" fill="none" stroke="var(--c3)" stroke-width="2.5"/>`;
  g+=ms.map((m,i)=>`<circle cx="${L+i*bw+bw/2}" cy="${T+(H-T-B)*(1-m.km/maxKm)}" r="3.5" fill="var(--c3)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg><div class="legend"><span style="color:var(--c2)">■</span> kr (venstre akse) &nbsp; <span style="color:var(--c3)">●</span> km kørt (højre akse)</div>`;
}

// ---------- biler
function renderCarForms(){
  $('#car-forms').innerHTML = S.vehicles.map(v => carForm(v)).join('');
  bindCarForms();
}
function carForm(v){
  v = v || {id:'', name:'', odo_unit:'km', odo_rollover:100000, tank_l:'', active:1};
  return `<div class="card" data-car="${v.id}">
    <div class="f"><label>Navn</label><input type="text" name="name" value="${esc(v.name)}"></div>
    <div class="grid2">
      <div class="f"><label>Tælleren viser</label><select name="odo_unit"><option value="km" ${v.odo_unit!=='mi'?'selected':''}>km</option><option value="mi" ${v.odo_unit==='mi'?'selected':''}>miles</option></select></div>
      <div class="f"><label>Tank (liter)</label><input type="number" inputmode="decimal" name="tank_l" value="${v.tank_l ?? ''}" placeholder="valgfri"></div>
    </div>
    <div class="f"><label>Tælleren slår om ved (0 = aldrig)</label><input type="number" name="odo_rollover" value="${v.odo_rollover ?? 100000}"></div>
    <label class="check"><input type="checkbox" name="active" ${v.active?'checked':''}><span>Vis i listen</span></label>
    <div style="text-align:right"><button class="btn pri small" data-savecar>Gem</button></div>
  </div>`;
}
function bindCarForms(){
  $$('[data-savecar]').forEach(b => b.onclick = async () => {
    const c = b.closest('[data-car]'), g = n => c.querySelector(`[name=${n}]`);
    try {
      const r = await api('api/vehicles', {method:'POST', body: JSON.stringify({id: c.dataset.car || null, name: g('name').value, odo_unit: g('odo_unit').value, tank_l: g('tank_l').value, odo_rollover: g('odo_rollover').value, active: g('active').checked})});
      toast('Gemt'); if (!S.vid) S.vid = r.id; await loadVehicles(); renderCarForms();
    } catch(e){ toast(e.message); }
  });
}
$('#add-car').onclick = () => { $('#car-forms').insertAdjacentHTML('beforeend', carForm(null)); bindCarForms(); };

// ---------- start
(async () => {
  try {
    await loadVehicles(); resetForm(); await refresh();
    const st = await api('api/status'); $('#ver').textContent = `v${st.version} · AI: ${st.ai_entity}`;
  } catch(e){ toast('Kunne ikke starte: '+e.message); }
})();
</script>
